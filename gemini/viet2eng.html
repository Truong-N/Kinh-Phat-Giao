<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viet to English</title>
    <style>
        .raw-ta,
        .source-ta,
        .translate-ta,
        .html-ta {
            width: 90%;
            height: 800px;
        }

        * {
            cursor: pointer;
        }

        .hide {
            display: none;
        }

        .viet {
            color: red;
        }
    </style>
</head>

<body>
   <div>
      <!-- sequence number:
      <input type="number" class="start" /><br> -->
      Raw Text<br>
      <textarea class="raw-ta"></textarea>
      <div>
         <button type="button" onclick="handleH1()">&lt;h1&gt;</button>
         <button type="button" onclick="handleH2()">&lt;h2&gt;</button>
         <button type="button" onclick="handleH3()">&lt;h3&gt;</button>
         <button type="button" onclick="handleH4()">&lt;h4&gt;</button>
         <button type="button" onclick="handleImg()">&lt;img&gt;</button>
         <button type="button" onclick="handleVideo()">&lt;video&gt;</button>
         <button type="button" onclick="handleUl()">&lt;ul&gt;</button>
         <button type="button" onclick="handlePre()">&lt;pre&gt;</button>
         <button type="button" onclick="handleMultiParagraphs()">&lt;p&gt;</button>
      </div>
    
      Source Text<br>
      <textarea class="source-ta"></textarea>
      <div>
         <button type="button" onclick="handleCopySource2Clipboard()">Copy to clipboard</button>
         <button type="button" id="divide-source-ta-btn">Divide</button>
         <p>array length: <span class="arrayenglish-len"></span></p>
      </div>
      <div id="divide-btn-group"></div>
      Translate Text 
      <button type="button" id="paste2translate-btn">Paste</button><br>

      <textarea class="translate-ta"></textarea>
      <div>
         <button type="button" id="remove-empty-lines-translate-ta-btn">Remove empty lines</button>
         <p>array length: <span class="arrayviet-len"></span></p>
      </div>
      <div>
         <button type="button" onclick="handleCombine1()">Combine 1</button>
         <button type="button" onclick="handleCombine2()">Combine 2</button>
         <button type="button" onclick="handleCopyHTMLTA2Clipboard()">Copy to clipboard</button>
      </div>

      <textarea class="html-ta"></textarea>
    <div class="result"></div>


    <script src="viet2eng.js">

    </script>
</body>

</html>
